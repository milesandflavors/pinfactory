name: Post pins to Pinterest

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (backup; primary trigger is external cron-job.org)
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write              # so the run can commit posted.json back

concurrency:
  group: pinterest-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post due pins
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python cloud_post.py

      - name: Save posting log
        if: always()
        run: |
          git config user.name "pin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if git diff --staged --quiet; then
            echo "No log changes to push."
          else
            git commit -m "update posted log [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { echo "pushed"; break; }
              echo "push retry $i"; sleep 5
            done
          fi
