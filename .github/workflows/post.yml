name: Post pins to Pinterest

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC); cloud_post.py gates by Europe/Budapest time
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write              # so the run can commit posted.json back

concurrency:
  group: pinterest-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post due pins
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python cloud_post.py

      - name: Save posting log
        run: |
          git config user.name "pin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted log [skip ci]"
          git push
